kind = "web"
previewPath = "/"
title = "Landsec Capital — Real Estate Investment"
version = "1.0.0"
id = "artifacts/landvest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26083

[services.development]
run = "pnpm --filter @workspace/landvest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landvest", "run", "build" ]
publicDir = "artifacts/landvest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26083"
BASE_PATH = "/"
